<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src https://collectionapi.metmuseum.org https://commons.wikimedia.org https://www.wikidata.org https://en.wikipedia.org; base-uri 'none'; form-action 'none'">
<title>Art History Study Buddy</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Art History Study Buddy</h1>

<!-- Home: exam list -->
<section id="home" class="panel">
  <h2>My Exams</h2>
  <div id="examList"></div>
  <button type="button" data-action="home.new">+ Add Exam</button>
</section>

<!-- Exam editor -->
<section id="editor" class="panel" hidden>
  <h2>New Exam</h2>
  <input type="text" id="exName" class="wide" aria-label="Exam name" placeholder="Exam name (e.g. Renaissance Midterm)">

  <div class="block">
    <div class="field-row">
      <input type="text" id="mdPath" class="grow" aria-label="Markdown file path" placeholder="/path/to/exam.md" data-enter="editor.importPath">
      <button type="button" data-action="editor.importPath">Import</button>
      <button type="button" class="secondary" data-action="editor.browse">Browse…</button>
    </div>
    <div class="small">
      Sections: <code>## Must Know Works</code> (<code>- Artist, Title, Date</code>) and
      <code>## Must Know Terms</code> (<code>- Term</code> or <code>- Term: definition</code>).
      Missing definitions are filled from Wikipedia.
    </div>
  </div>

  <h3>Must Know Works</h3>
  <div class="field-row">
    <input type="text" id="searchQ" class="grow" aria-label="Search the Met" placeholder="Search Met by title/artist" data-enter="editor.search">
    <button type="button" data-action="editor.search">Search</button>
  </div>
  <div id="searchResults"></div>
  <div class="small">Added (<span id="addedCount">0</span>)</div>
  <div id="addedList"></div>

  <h3>Must Know Terms</h3>
  <textarea id="exTerms" class="wide" aria-label="Terms, one per line" rows="5" placeholder="One per line:&#10;term: definition&#10;Chiaroscuro: strong light/dark contrast"></textarea>

  <h3>Random art pool (optional)</h3>
  <label class="small"><input type="checkbox" id="useFilter" data-change="editor.toggleFilter"> Pull random Met art by filter</label>
  <div id="filterFields" hidden>
    <select id="exDept" class="wide" aria-label="Department"><option value="">Any department</option></select>
    <div class="field-row">
      <input id="exFrom" class="grow" type="number" aria-label="From year" placeholder="From year (neg = BC)">
      <input id="exTo" class="grow" type="number" aria-label="To year" placeholder="To year">
    </div>
    <input type="text" id="exQ" class="wide" aria-label="Keyword" placeholder="Keyword (optional, e.g. portrait)">
  </div>

  <div class="block">
    <button type="button" data-action="editor.save">Save Exam</button>
    <button type="button" class="secondary" data-action="editor.cancel">Cancel</button>
  </div>
  <div id="editorMsg" class="small"></div>
</section>

<!-- Study -->
<section id="study" class="panel center" hidden>
  <h2 id="studyTitle">Study</h2>
  <div class="study-bar">
    <button type="button" class="secondary" data-action="study.back">&larr; Exams</button>
    <select id="mode" aria-label="Study mode" data-change="study.next">
      <option value="flash">Flashcard</option>
      <option value="quiz">Quiz</option>
    </select>
    <select id="source" aria-label="Study source" data-change="study.next"></select>
  </div>
  <div id="card"></div>
  <div id="score" class="small"></div>
</section>

<script type="module" src="js/app.js"></script>
</body>
</html>
